name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run it makes obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDK_VER: "11_00_00"
  BUILDER_IMAGE: ti-am67-edgeai:ci

# Everything runs on native arm64 runners. Building the arm64 image on x86
# runners goes through QEMU, which is ~10x slower and crashes cc1plus.
jobs:
  image:
    name: Builder image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/builder-image
        with:
          tag: ${{ env.BUILDER_IMAGE }}
          save-cache: "true"

  # Independent components build in parallel, one runner each. TIDL only needs
  # the vision_apps package, so it runs right after vision_lib in the same job.
  component:
    name: ${{ matrix.name }}
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vision_lib+tidl
            run: task build:vision_lib && task install:debs && task build:tidl
          - name: onnxrt
            run: task build:onnxrt
          - name: tflite
            run: task build:tflite
          - name: dlr
            run: task build:dlr
          - name: gstreamer
            run: task build:gstreamer
          - name: v4l2
            run: task build:v4l2
          - name: rpmsg
            run: task build:rpmsg
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/builder-image
        with:
          tag: ${{ env.BUILDER_IMAGE }}

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Build
        run: .github/scripts/in-builder.sh 'mkdir -p out workarea && ${{ matrix.run }}'

      # Saved even when the build fails, so the next attempt starts warm.
      # Pull requests only read the cache that main writes.
      - name: Save ccache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.name }}
          path: |
            out/*.deb
            out/*.whl
          if-no-files-found: error
          retention-days: 7

  package:
    name: edgeai packages
    needs: component
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/builder-image
        with:
          tag: ${{ env.BUILDER_IMAGE }}

      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true

      - name: Build
        run: .github/scripts/in-builder.sh 'mkdir -p workarea && task build:edgeai_debs && task build:t3_gem_o1_edgeai_debs'

      - uses: actions/upload-artifact@v7
        with:
          name: ti-am67-edgeai-packages
          path: |
            out/*.deb
            out/*.whl
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ti-am67-edgeai-packages
          path: out

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.deb
            out/*.whl
