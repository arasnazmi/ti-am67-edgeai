name: Builder image
description: >
  Loads the arm64 build container from the Dockerfile into the local Docker
  daemon, reusing layers from the GitHub Actions cache.

inputs:
  tag:
    description: Tag for the loaded image.
    required: false
    default: ti-am67-edgeai:ci
  save-cache:
    description: Write the image layers back to the GitHub Actions cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - uses: docker/setup-buildx-action@v4

    - uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/arm64
        tags: ${{ inputs.tag }}
        load: true
        provenance: false
        cache-from: type=gha,scope=builder-arm64
        cache-to: ${{ inputs.save-cache == 'true' && 'type=gha,scope=builder-arm64,mode=max' || '' }}
